<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* Facebook Page cover — rendered 1640x624 (2x of 820x312).
     ⚠️ CROP SAFETY: desktop shows the full 2.63:1 strip, mobile crops to a much
     narrower ~1.78:1 centre. So EVERYTHING that must be read is centred inside
     .safe (middle 62%), and the cell art is duplicated on BOTH flanks so either
     side can be cropped away without unbalancing it.
     ⚠️ The profile picture overlaps the bottom-left on desktop — that corner is
     deliberately empty.
     ⚠️ NO phone number other than the confirmed primary line. The old cover said
     "WHATSAPP US @ 0324-4004778", a number that appears nowhere in lib/site.ts. */
  :root{
    --ink:#14100f; --ink2:#241a17;
    --paper:oklch(98.5% 0.003 60);
    --accent:oklch(58% 0.12 30);
    --sun:oklch(82% 0.13 74);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1640px;height:624px;position:relative;overflow:hidden;
       font-family:"Inter Tight",sans-serif;color:#fff;
       background:radial-gradient(1200px 700px at 50% 22%, #2c201c 0%, var(--ink2) 45%, var(--ink) 100%)}

  /* faint engineering grid, keeps the flat ground from looking empty */
  .grid{position:absolute;inset:0;opacity:.16;
    background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(900px 460px at 50% 45%,#000 35%,transparent 78%)}
  /* warm spotlight behind the type */
  .spot{position:absolute;inset:0;
    background:radial-gradient(760px 400px at 50% 46%,rgba(255,214,150,.15),transparent 68%)}

  /* Cell art on both flanks — either can be cropped without breaking the layout */
  .cell{position:absolute;bottom:-118px;height:760px;width:auto;opacity:.9;
        filter:drop-shadow(0 26px 60px rgba(0,0,0,.6))}
  .cell.l{left:-92px;transform:rotate(-9deg)}
  /* no scaleX(-1) on the right cell — mirroring flips the label text and the QR,
     which reads as a fake product photo. Just counter-rotate. */
  .cell.r{right:-92px;transform:rotate(9deg)}
  .vig{position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(20,16,15,.92) 0%,rgba(20,16,15,.35) 22%,
               rgba(20,16,15,0) 42%,rgba(20,16,15,0) 58%,rgba(20,16,15,.35) 78%,rgba(20,16,15,.92) 100%)}

  .safe{position:absolute;left:19%;right:19%;top:0;bottom:0;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;gap:0;z-index:3}

  .logo{height:66px;width:auto;margin-bottom:22px;
        filter:drop-shadow(0 3px 14px rgba(0,0,0,.55))}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:16px;letter-spacing:.26em;
           text-transform:uppercase;color:var(--sun);font-weight:600}
  h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:70px;line-height:1.02;
     letter-spacing:-.012em;margin-top:16px;text-shadow:0 3px 26px rgba(0,0,0,.55);white-space:nowrap}
  h1 em{font-style:italic;color:var(--sun)}
  .sub{font-size:22px;font-weight:500;color:rgba(255,255,255,.9);margin-top:18px;
       letter-spacing:.005em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .sub b{color:#fff;font-weight:700}
  /* full product roster — the user's rule: the cover must mention the other
     lines too, not just cells + stabilizers */
  .roster{margin-top:22px;font-family:"JetBrains Mono",monospace;font-size:15px;
        letter-spacing:.09em;text-transform:uppercase;color:var(--sun);
        opacity:.95}
  .foot{margin-top:14px;display:flex;align-items:center;gap:14px;
        font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.09em;
        text-transform:uppercase;color:rgba(255,255,255,.72)}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .wa{display:inline-flex;align-items:center;gap:9px;color:#fff;font-weight:600}
  .wa svg{width:19px;height:19px}
</style>
</head>
<body>
  <img class="cell l" src="../../public/assets/eve-cell.png" alt="" />
  <img class="cell r" src="../../public/assets/eve-cell.png" alt="" />
  <div class="vig"></div>
  <div class="grid"></div>
  <div class="spot"></div>

  <div class="safe">
    <img class="logo" src="../assets/voltec-logo.png" alt="Voltec Appliances" />
    <div class="eyebrow">Lahore · Since 1995</div>
    <h1>Genuine EVE lithium cells<br />&amp; <em>voltage stabilizers</em></h1>
    <div class="sub">Grade-A &middot; QR-traceable &middot; <b>full test report with every carton</b></div>
    <div class="roster">Cells &amp; packs &middot; BMS &middot; Servo / AVR / IGBT &middot; 3-phase industrial</div>
    <div class="foot">
      <span>Dealers &amp; assemblers</span>
      <span class="dot"></span>
      <span class="wa">
        <svg viewBox="0 0 32 32" fill="#25D366"><path d="M16 3C9 3 3.5 8.5 3.5 15.5c0 2.4.7 4.6 1.8 6.5L3 29l7.2-2.3c1.8 1 3.9 1.5 5.8 1.5 7 0 12.5-5.5 12.5-12.5S23 3 16 3zm0 22.7c-1.8 0-3.5-.5-5-1.4l-.4-.2-4.3 1.4 1.4-4.2-.3-.4c-1-1.6-1.5-3.4-1.5-5.4 0-5.6 4.6-10.2 10.1-10.2s10.1 4.6 10.1 10.2S21.6 25.7 16 25.7z"/><path d="M21.6 18.3c-.3-.2-1.8-.9-2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.2 3.4 5.3 4.7.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.3-.6-.4z"/></svg>
        +92 321 1644447
      </span>
    </div>
  </div>
</body>
</html>
